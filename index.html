<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muzyczne Klocki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: toy console — transport on top, block palette, then a horizontally scrolling arrangement board with tracks as rows and bars as columns */
:root{
  --bg:#231d52; --panel:#2f2869; --panel2:#3a3280; --ink:#fbf8ff; --muted:#b7b0e6; --line:#4a4196;
  --go:#3ddc84; --stop:#ff5d73;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --lab:86px; --cell:68px; --rowh:58px;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);font-weight:600;padding-inline:16px;padding-block:14px 32px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,42px);line-height:1;margin:0;flex:1 1 auto;letter-spacing:.5px}
h1 span{display:inline-block;transform:rotate(-3deg)}
h1 span:nth-child(odd){transform:rotate(3deg)}
.transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.play{width:72px;height:72px;border-radius:50%;background:var(--go);color:#0f3d24;display:grid;place-items:center;box-shadow:0 6px 0 #1f8f52;transition:transform .08s}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #1f8f52}
.play.on{background:var(--stop);color:#4a0d17;box-shadow:0 6px 0 #b8324a}
.play svg{width:32px;height:32px}
.tempo{background:var(--panel);border-radius:16px;padding:8px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tempo label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.tempo b{font-family:var(--display);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.tempo input{width:150px;max-width:100%;accent-color:#ffd23f}

.palette{background:var(--panel);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:999px;background:var(--panel2);font-family:var(--display);font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.tab i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.tab[aria-pressed="true"]{background:var(--c);color:#1c1640}
.tab[aria-pressed="true"] i{background:#1c1640}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.blk{position:relative;border-radius:16px;padding:10px 12px 12px;background:var(--c);color:#1c1640;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s}
.blk:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.blk .nm{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1}
.blk[aria-pressed="true"]{outline:4px solid #fff;outline-offset:3px}
.blk.eraser{background:var(--panel2);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.blk .sub{font-size:12px;opacity:.75}
.mini{display:flex;align-items:flex-end;gap:1px;height:22px}
.mini span{flex:1;background:currentColor;opacity:.75;border-radius:1px;min-height:0}
.hint{margin:0;color:var(--muted);font-size:14px}

.board{overflow-x:auto;border-radius:22px;background:var(--panel);-webkit-overflow-scrolling:touch}
.grid{position:relative;display:grid;grid-template-columns:var(--lab) repeat(16,var(--cell));width:max-content;padding:10px 10px 12px 0;gap:6px 4px}
.corner,.lab{position:sticky;left:0;z-index:2;background:var(--panel)}
.num{text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-block:2px;border-radius:6px}
.num.now{background:#ffd23f;color:#1c1640}
.lab{display:flex;align-items:center;gap:6px;padding-left:10px;font-family:var(--display);font-weight:800;font-size:15px;text-align:left;height:var(--rowh)}
.lab i{width:10px;height:28px;border-radius:5px;background:var(--c);flex:none}
.lab.muted{opacity:.4;text-decoration:line-through}
.cell{height:var(--rowh);border-radius:12px;background:var(--panel2);border:2px dashed var(--line);padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden}
.cell.fill{background:var(--c);border:2px solid rgba(0,0,0,.18);color:#1c1640}
.cell.fill .nm{font-size:11px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .mini{height:16px}
.row-on .cell:not(.fill){border-color:var(--c)}
.row-off .cell{opacity:.45}
.head{position:absolute;top:0;bottom:0;width:3px;background:#ffd23f;border-radius:2px;pointer-events:none;z-index:1;box-shadow:0 0 12px #ffd23f;left:0}
.head[hidden]{display:none!important}
.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.lit{filter:brightness(1.25)}

.tools{display:flex;gap:10px;flex-wrap:wrap}
.tool{padding:10px 16px;border-radius:14px;background:var(--panel);font-weight:800}
.tool.warn{background:var(--stop);color:#4a0d17}
@media (max-width:520px){ :root{--lab:70px;--cell:60px} .lab{font-size:13px} .tempo input{width:120px} }
@media (prefers-reduced-motion:reduce){ .pop{animation:none} .play,.blk{transition:none} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><span>M</span><span>u</span><span>z</span><span>y</span><span>c</span><span>z</span><span>n</span><span>e</span> <span>K</span><span>l</span><span>o</span><span>c</span><span>k</span><span>i</span></h1>
    <div class="transport">
      <div class="tempo">
        <label for="bpm">Tempo</label>
        <input id="bpm" type="range" min="70" max="150" value="112">
        <b id="bpmv">112</b>
      </div>
      <button class="play" id="play" aria-label="Graj">
        <svg viewBox="0 0 24 24" id="playIco"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
      </button>
    </div>
  </header>

  <section class="palette" aria-label="Klocki z dźwiękami">
    <div class="tabs" id="tabs"></div>
    <div class="blocks" id="blocks"></div>
    <p class="hint" id="hint">Stuknij klocek, żeby go usłyszeć. Potem stuknij puste pole na ścieżce, żeby go tam położyć.</p>
  </section>

  <div class="board" id="board"><div class="grid" id="grid"><div class="head" id="head" hidden></div></div></div>

  <div class="tools">
    <button class="tool" id="demo">Przykładowa piosenka</button>
    <button class="tool" id="clear">Wyczyść wszystko</button>
  </div>
</div>

<script>
(function(){
const BARS=16;
const TRACKS=[
  {name:'Bębny', c:'#ff7a59'},
  {name:'Bas',   c:'#b48cff'},
  {name:'Melodia',c:'#ffd23f'},
  {name:'Akordy',c:'#4fe3c1'},
  {name:'Efekty',c:'#ff8fd1'}
];
const SHADES=[
  ['#ff7a59','#ff9e6b','#ff6b8a','#ffb38a'],
  ['#b48cff','#9f9bff','#cf9cff','#8fb0ff'],
  ['#ffd23f','#ffe36e','#f5c04a','#fff09a'],
  ['#4fe3c1','#7cf0a0','#5fd0e8','#a6f5d9'],
  ['#ff8fd1','#7fd3ff','#c6ff7a','#ffb0e0']
];
function D(p){const ev=[];for(const k in p){for(let i=0;i<16;i++){const ch=p[k][i];if(ch!=='.')ev.push({s:i,d:k,v:ch==='X'?1:(ch==='o'?.5:.8)});}}return ev;}
function N(a){return a.map(([s,n,l])=>({s,n,l}));}
const Am=[57,60,64,69],G=[55,59,62,67],F=[53,57,60,65];
const LOOPS={
 d1:{t:0,name:'Bum-cyk',ev:D({k:'X.......X.......',s:'....x.......x...',h:'x.o.x.o.x.o.x.o.'})},
 d2:{t:0,name:'Disko',ev:D({k:'X...X...X...X...',s:'....x.......x...',o:'..x...x...x...x.'})},
 d3:{t:0,name:'Hip-hop',ev:D({k:'X..x......x.....',s:'....x.......x..o',h:'x.o.x.o.x.o.xox.'})},
 d4:{t:0,name:'Klaskanie',ev:D({k:'X.....x.x.......',c:'....x.......x...',h:'xoooxoooxoooxooo'})},
 b1:{t:1,name:'Bum bas',ev:N([[0,45,4],[8,45,4],[14,52,2]])},
 b2:{t:1,name:'Skoczek',ev:N([[0,45,1],[2,57,1],[4,45,1],[6,57,1],[8,48,1],[10,60,1],[12,50,1],[14,55,1]])},
 b3:{t:1,name:'Spacer',ev:N([[0,45,3],[4,48,3],[8,50,3],[12,52,3]])},
 b4:{t:1,name:'Groove',ev:N([[0,45,2],[3,45,1],[6,55,2],[10,52,2],[12,50,3]])},
 m1:{t:2,name:'Ptaszek',ev:N([[0,81,2],[2,79,2],[4,76,2],[6,74,2],[8,72,2],[10,74,2],[12,76,4]])},
 m2:{t:2,name:'Gwiazdka',ev:N([[0,69,2],[2,72,2],[4,76,4],[8,74,2],[10,72,2],[12,69,4]])},
 m3:{t:2,name:'Echo',ev:N([[0,76,2],[3,76,2],[6,79,2],[8,76,2],[11,74,2],[14,72,2]])},
 m4:{t:2,name:'Fanfara',ev:N([[0,69,1],[1,69,1],[2,76,3],[6,76,2],[8,81,4],[12,79,4]])},
 c1:{t:3,name:'Słońce',ev:[{s:0,c:Am,l:16}]},
 c2:{t:3,name:'Fala',ev:[{s:0,c:Am,l:8},{s:8,c:G,l:8}]},
 c3:{t:3,name:'Księżyc',ev:[{s:0,c:F,l:8},{s:8,c:G,l:8}]},
 c4:{t:3,name:'Pyk-pyk',ev:[{s:0,c:Am,l:2,p:1},{s:3,c:Am,l:2,p:1},{s:6,c:Am,l:2,p:1},{s:10,c:G,l:2,p:1},{s:12,c:G,l:2,p:1}]},
 x1:{t:4,name:'Laser',ev:[{s:0,f:'laser',l:2},{s:4,f:'laser',l:2},{s:6,f:'laser',l:2}]},
 x2:{t:4,name:'Boing',ev:[{s:0,f:'boing',l:3},{s:8,f:'boing',l:3}]},
 x3:{t:4,name:'UFO',ev:[{s:0,f:'ufo',l:16}]},
 x4:{t:4,name:'Dzwonki',ev:[{s:0,f:'bell',n:93,l:3},{s:4,f:'bell',n:88,l:3},{s:8,f:'bell',n:91,l:3},{s:12,f:'bell',n:81,l:4}]}
};
const BY_TRACK=TRACKS.map((_,t)=>Object.keys(LOOPS).filter(k=>LOOPS[k].t===t));
for(const t in BY_TRACK) BY_TRACK[t].forEach((k,i)=>LOOPS[k].c=SHADES[t][i]);

function shape(loop){
  const h=new Array(16).fill(0);
  let lo=999,hi=0;loop.ev.forEach(e=>{if(e.n){lo=Math.min(lo,e.n);hi=Math.max(hi,e.n);}});
  loop.ev.forEach(e=>{
    let v;
    if(e.d) v={k:1,s:.7,c:.7,h:.35,o:.45}[e.d]*(e.v>.6?1:.7);
    else if(e.n && e.f!=='bell') v=hi>lo? .35+.65*(e.n-lo)/(hi-lo) : .7;
    else v=e.c?.6:.9;
    const l=e.l||1;
    for(let i=0;i<l&&e.s+i<16;i++) h[e.s+i]=Math.max(h[e.s+i], i===0?v:v*.55);
  });
  return h;
}
function mini(loop){
  const m=document.createElement('div');m.className='mini';m.setAttribute('aria-hidden','true');
  shape(loop).forEach(v=>{const s=document.createElement('span');s.style.height=(v*100)+'%';m.appendChild(s);});
  return m;
}

/* ---------- audio ---------- */
let ctx,out,noise;
function audio(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
    out=ctx.createGain();out.gain.value=.85;out.connect(comp);comp.connect(ctx.destination);
    noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ctx.state==='suspended')ctx.resume();
}
const mtof=n=>440*Math.pow(2,(n-69)/12);
function env(g,t,peak,att,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec);}
function osc(type,f,t,dur,dest){const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(t+dur+.05);return o;}
function gain(dest){const g=ctx.createGain();g.connect(dest||out);return g;}
function nz(t,dur,dest){const s=ctx.createBufferSource();s.buffer=noise;s.connect(dest);s.start(t);s.stop(t+dur);}
function filt(type,f,dest,q){const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;b.connect(dest);return b;}

function drum(e,t){
  const v=e.v;
  if(e.d==='k'){const g=gain();env(g,t,1*v,.002,.35);const o=osc('sine',150,t,.4,g);o.frequency.exponentialRampToValueAtTime(42,t+.14);}
  else if(e.d==='s'){const g=gain();env(g,t,.45*v,.002,.17);nz(t,.2,filt('highpass',1300,g));const g2=gain();env(g2,t,.3*v,.002,.08);osc('triangle',190,t,.1,g2);}
  else if(e.d==='h'||e.d==='o'){const open=e.d==='o';const g=gain();env(g,t,(open?.18:.14)*v,.001,open?.22:.045);nz(t,open?.25:.06,filt('highpass',7500,g));}
  else if(e.d==='c'){const g=gain();const b=filt('bandpass',1500,g,1.2);
    [0,.012,.024].forEach((o,i)=>{g.gain.setValueAtTime(.5*v,t+o);g.gain.exponentialRampToValueAtTime(i<2?.05:.0001,t+o+(i<2?.011:.16));});nz(t,.2,b);}
}
function tone(tr,e,t,sd){
  const dur=Math.max(.08,(e.l||1)*sd*.92);
  if(tr===1){
    const g=gain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.42,t+.01);g.gain.setValueAtTime(.42,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    const f=filt('lowpass',300,g,6);f.frequency.setValueAtTime(1600,t);f.frequency.exponentialRampToValueAtTime(260,t+.18);
    osc('sawtooth',mtof(e.n),t,dur,f);osc('sine',mtof(e.n-12),t,dur,g);
  } else if(tr===2){
    const g=gain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.11,t+.015);g.gain.setValueAtTime(.11,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.08);
    const f=filt('lowpass',3200,g);
    const o=osc('square',mtof(e.n),t,dur+.1,f);
    const lfo=ctx.createOscillator();lfo.frequency.value=5.5;const lg=ctx.createGain();lg.gain.value=4;lfo.connect(lg);lg.connect(o.frequency);lfo.start(t+.12);lfo.stop(t+dur+.15);
  } else if(tr===3){
    const pl=e.p;const g=gain();
    if(pl){env(g,t,.13,.004,dur*1.3);}
    else{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.075,t+.12);g.gain.setValueAtTime(.075,t+dur-.1);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.15);}
    const f=filt('lowpass',pl?2200:1300,g);
    e.c.forEach(n=>{osc('sawtooth',mtof(n),t,dur+.2,f).detune.value=-7;osc('sawtooth',mtof(n),t,dur+.2,f).detune.value=7;});
  } else if(tr===4){
    if(e.f==='laser'){const g=gain();env(g,t,.12,.003,.25);const o=osc('square',2200,t,.3,filt('lowpass',4000,g));o.frequency.exponentialRampToValueAtTime(110,t+.25);}
    else if(e.f==='boing'){const g=gain();env(g,t,.35,.005,.45);const o=osc('sine',110,t,.5,g);o.frequency.exponentialRampToValueAtTime(520,t+.09);o.frequency.exponentialRampToValueAtTime(260,t+.45);
      const l=ctx.createOscillator();l.frequency.value=18;const lg=ctx.createGain();lg.gain.value=40;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+.5);}
    else if(e.f==='ufo'){const g=gain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.3);g.gain.setValueAtTime(.07,t+dur-.3);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      const o=osc('sine',700,t,dur,g);o.frequency.linearRampToValueAtTime(950,t+dur);const l=ctx.createOscillator();l.frequency.value=7;const lg=ctx.createGain();lg.gain.value=160;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur);}
    else if(e.f==='bell'){const g=gain();env(g,t,.16,.002,1.1);const c=osc('sine',mtof(e.n),t,1.2,g);
      const mg=ctx.createGain();mg.gain.setValueAtTime(mtof(e.n)*2,t);mg.gain.exponentialRampToValueAtTime(1,t+.8);const m=osc('sine',mtof(e.n)*3.5,t,1.2,mg);mg.connect(c.frequency);}
  }
}
function playEvent(tr,e,t,sd){ if(tr===0) drum(e,t); else tone(tr,e,t,sd); }

/* ---------- state ---------- */
const KEY='muzyczne-klocki-v1';
let song=emptySong(), muted=[false,false,false,false,false], cat=0, sel='d1';
function emptySong(){return TRACKS.map(()=>new Array(BARS).fill(null));}
function demoSong(){
  const s=emptySong();
  for(let b=0;b<12;b++){s[0][b]= b<2?null: (b%4===3?'d3':'d1'); s[3][b]= b%2? 'c3':'c2';}
  s[0][0]='d4';s[0][1]='d4';
  for(let b=2;b<12;b++) s[1][b]= b%2?'b4':'b2';
  s[2][4]='m2';s[2][5]='m1';s[2][6]='m2';s[2][7]='m4';s[2][8]='m3';s[2][9]='m1';s[2][10]='m3';s[2][11]='m4';
  s[4][0]='x3';s[4][4]='x1';s[4][8]='x4';s[4][11]='x2';
  return s;
}
try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(Array.isArray(d.song)&&d.song.length===5)song=d.song.map(r=>r.map(k=>LOOPS[k]?k:null));}else song=demoSong();}catch(e){song=demoSong();}
function save(){try{localStorage.setItem(KEY,JSON.stringify({song,bpm:+bpmEl.value}));}catch(e){}}

/* ---------- UI ---------- */
var bpmEl=document.getElementById('bpm');
const bpmV=document.getElementById('bpmv'), tabs=document.getElementById('tabs'), blocks=document.getElementById('blocks'),
      grid=document.getElementById('grid'), head=document.getElementById('head'), board=document.getElementById('board'),
      hint=document.getElementById('hint'), playBtn=document.getElementById('play'), playIco=document.getElementById('playIco');
try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');if(d.bpm)bpmEl.value=d.bpm;}catch(e){}
bpmV.textContent=bpmEl.value;
bpmEl.addEventListener('input',()=>{bpmV.textContent=bpmEl.value;save();});

function renderTabs(){
  tabs.innerHTML='';
  TRACKS.forEach((t,i)=>{const b=document.createElement('button');b.className='tab';b.style.setProperty('--c',t.c);
    b.setAttribute('aria-pressed',i===cat);b.innerHTML='<i></i>'+t.name;b.onclick=()=>{cat=i;sel=BY_TRACK[i][0];renderTabs();renderBlocks();renderGrid();};tabs.appendChild(b);});
}
function renderBlocks(){
  blocks.innerHTML='';
  BY_TRACK[cat].forEach(k=>{const L=LOOPS[k];const b=document.createElement('button');b.className='blk';b.style.setProperty('--c',L.c);
    b.setAttribute('aria-pressed',sel===k);
    const nm=document.createElement('span');nm.className='nm';nm.textContent=L.name;b.append(nm,mini(L));
    b.onclick=()=>{sel=k;renderBlocks();renderGrid();preview(k);hint.textContent='Teraz stuknij pole na ścieżce „'+TRACKS[cat].name+'”, żeby położyć „'+L.name+'”.';};
    blocks.appendChild(b);});
  const er=document.createElement('button');er.className='blk eraser';er.setAttribute('aria-pressed',sel==='erase');
  er.innerHTML='<span class="nm">Gumka</span><span class="sub">Stuknij klocek na ścieżce, żeby go zabrać</span>';
  er.onclick=()=>{sel='erase';renderBlocks();renderGrid();hint.textContent='Gumka włączona. Stuknij klocek na dowolnej ścieżce, żeby go zabrać.';};
  blocks.appendChild(er);
}
let cells=[], nums=[];
function renderGrid(popAt){
  [...grid.children].forEach(c=>{if(c!==head)c.remove();});
  cells=TRACKS.map(()=>[]);nums=[];
  const corner=document.createElement('div');corner.className='corner';grid.appendChild(corner);
  for(let b=0;b<BARS;b++){const n=document.createElement('div');n.className='num';n.textContent=b+1;grid.appendChild(n);nums.push(n);}
  TRACKS.forEach((t,ti)=>{
    const lab=document.createElement('button');lab.className='lab'+(muted[ti]?' muted':'');lab.style.setProperty('--c',t.c);
    lab.innerHTML='<i></i>'+t.name;lab.title=muted[ti]?'Włącz dźwięk ścieżki':'Wycisz ścieżkę';
    lab.setAttribute('aria-label',(muted[ti]?'Włącz ':'Wycisz ')+t.name);
    lab.onclick=()=>{muted[ti]=!muted[ti];renderGrid();};
    grid.appendChild(lab);
    const rowCls= sel==='erase'?'':(ti===cat?'row-on':'');
    for(let b=0;b<BARS;b++){
      const k=song[ti][b];const c=document.createElement('button');
      c.className='cell'+(k?' fill':'');c.style.setProperty('--c',k?LOOPS[k].c:t.c);
      if(rowCls)c.classList.add(rowCls);
      c.setAttribute('aria-label',t.name+', takt '+(b+1)+(k?': '+LOOPS[k].name:': puste'));
      if(k){const nm=document.createElement('span');nm.className='nm';nm.textContent=LOOPS[k].name;c.append(nm,mini(LOOPS[k]));}
      if(popAt&&popAt[0]===ti&&popAt[1]===b)c.classList.add('pop');
      c.onclick=()=>tapCell(ti,b);
      grid.appendChild(c);cells[ti].push(c);
    }
  });
}
function tapCell(t,b){
  const k=song[t][b];
  if(sel==='erase'){ if(k){song[t][b]=null;save();renderGrid();} return; }
  if(LOOPS[sel].t!==t){ cat=t; sel=k||BY_TRACK[t][0]; renderTabs();renderBlocks();renderGrid();
    hint.textContent='To ścieżka „'+TRACKS[t].name+'”. Wybierz klocek dla niej i stuknij jeszcze raz.'; return; }
  if(k===sel){song[t][b]=null;}
  else{song[t][b]=sel; if(!playing)preview(sel);}
  save();renderGrid([t,b]);
}

/* ---------- playback ---------- */
let playing=false, step=0, nextT=0, timer=null, queue=[], raf=null, previewEnd=0;
const stepDur=()=>60/(+bpmEl.value)/4;
function songLen(){let last=-1;song.forEach(r=>r.forEach((k,b)=>{if(k&&b>last)last=b;}));return Math.max(1,last+1);}
function preview(k){
  if(playing)return;audio();
  const L=LOOPS[k],sd=stepDur(),t0=ctx.currentTime+.05;
  L.ev.forEach(e=>playEvent(L.t,e,t0+e.s*sd,sd));
  previewEnd=t0+16*sd;
}
function schedule(){
  const sd=stepDur(),len=songLen()*16;
  while(nextT<ctx.currentTime+.12){
    if(step>=len)step=0;
    const bar=Math.floor(step/16),s=step%16;
    for(let t=0;t<TRACKS.length;t++){
      if(muted[t])continue;const k=song[t][bar];if(!k)continue;
      LOOPS[k].ev.forEach(e=>{if(e.s===s)playEvent(t,e,nextT,sd);});
    }
    queue.push({step,t:nextT});
    nextT+=sd;step++;
  }
}
let curBar=-1;
function draw(){
  const now=ctx.currentTime;let cur=null;
  while(queue.length&&queue[0].t<=now){cur=queue.shift();}
  if(cur){
    const bar=Math.floor(cur.step/16),s=cur.step%16;
    const ref=nums[bar];
    if(ref){head.hidden=false;head.style.transform='translateX('+(ref.offsetLeft+ref.offsetWidth*(s/16))+'px)';}
    if(bar!==curBar){
      nums.forEach((n,i)=>n.classList.toggle('now',i===bar));
      cells.forEach(r=>r.forEach((c,i)=>c.classList.toggle('lit',i===bar)));
      curBar=bar;
      if(ref){const l=ref.offsetLeft-parseInt(getComputedStyle(document.documentElement).getPropertyValue('--lab'))-8;
        if(l<board.scrollLeft||ref.offsetLeft+ref.offsetWidth>board.scrollLeft+board.clientWidth)board.scrollTo({left:Math.max(0,l),behavior:'smooth'});}
    }
  }
  raf=requestAnimationFrame(draw);
}
function setIcon(on){
  playBtn.classList.toggle('on',on);playBtn.setAttribute('aria-label',on?'Stop':'Graj');
  playIco.innerHTML=on?'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>':'<path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/>';
}
function start(){audio();playing=true;step=0;queue=[];curBar=-1;nextT=ctx.currentTime+.08;schedule();timer=setInterval(schedule,25);raf=requestAnimationFrame(draw);setIcon(true);}
function stop(){playing=false;clearInterval(timer);cancelAnimationFrame(raf);head.hidden=true;nums.forEach(n=>n.classList.remove('now'));cells.forEach(r=>r.forEach(c=>c.classList.remove('lit')));
  if(out){out.gain.setValueAtTime(0,ctx.currentTime);out.gain.setValueAtTime(.85,ctx.currentTime+.15);}setIcon(false);}
playBtn.onclick=()=>playing?stop():start();
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();playBtn.click();}});

document.getElementById('demo').onclick=()=>{song=demoSong();save();renderGrid();hint.textContent='Załadowana przykładowa piosenka. Naciśnij zielony przycisk!';};
const clr=document.getElementById('clear');let armed=null;
clr.onclick=()=>{
  if(!armed){clr.textContent='Na pewno? Stuknij jeszcze raz';clr.classList.add('warn');armed=setTimeout(()=>{armed=null;clr.textContent='Wyczyść wszystko';clr.classList.remove('warn');},3000);return;}
  clearTimeout(armed);armed=null;clr.textContent='Wyczyść wszystko';clr.classList.remove('warn');
  song=emptySong();save();renderGrid();hint.textContent='Pusto! Wybierz klocek i zacznij od nowa.';
};

renderTabs();renderBlocks();renderGrid();
})();
</script>
