<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Muzyczne Klocki</title>
<meta name="description" content="Aplikacja dla dzieci do tworzenia muzyki z kolorowych klocków.">
<meta name="theme-color" content="#231d52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klocki">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
html,body{height:auto}
/* Layout: toy console — profile chip + icons on top, dancing stage with transport, block palette, scrolling arrangement board, songs shelf; overlays for intro, parent panel and modals */
:root{
  --hue:250;
  --bg:hsl(var(--hue) 47% 21%); --panel:hsl(var(--hue) 44% 28%); --panel2:hsl(var(--hue) 42% 35%);
  --ink:#fbf8ff; --muted:hsl(var(--hue) 55% 82%); --line:hsl(var(--hue) 38% 45%);
  --go:#3ddc84; --stop:#ff5d73; --sun:#ffd23f; --dark:#1c1640; --chip:hsl(var(--hue) 40% 40%);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --lab:126px; --cell:68px; --rowh:58px; --blk:122px;
  color-scheme:dark;
}
[data-skin="jasny"]{--bg:hsl(var(--hue) 70% 95%);--panel:hsl(var(--hue) 60% 89%);--panel2:hsl(var(--hue) 55% 82%);--ink:hsl(var(--hue) 50% 14%);--muted:hsl(var(--hue) 25% 36%);--line:hsl(var(--hue) 35% 68%);--chip:hsl(var(--hue) 45% 76%);color-scheme:light}
[data-skin="noc"]{--bg:hsl(var(--hue) 30% 7%);--panel:hsl(var(--hue) 25% 12%);--panel2:hsl(var(--hue) 22% 18%);--ink:#e9e6f2;--muted:hsl(var(--hue) 15% 64%);--line:hsl(var(--hue) 18% 27%);--chip:hsl(var(--hue) 20% 22%)}
[data-big="1"]{--cell:84px;--rowh:72px;--blk:150px;--lab:124px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);overscroll-behavior:none;touch-action:manipulation}
body{margin:0;font-family:var(--body);font-weight:600;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.05;text-wrap:balance}
h2{font-size:22px}h3{font-size:18px}
.muted{color:var(--muted)}
svg.i{width:24px;height:24px;flex:none}

/* header */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:4px 14px 4px 4px;min-width:0}
.me canvas{width:42px;height:42px;border-radius:50%}
.me span{font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.top h1{flex:1 1 auto;font-size:clamp(24px,5vw,36px);min-width:0}
.top h1 span{display:inline-block;transform:rotate(-3deg)}.top h1 span:nth-child(odd){transform:rotate(3deg)}
.icons{display:flex;gap:8px}
.ico{width:46px;height:46px;border-radius:14px;background:var(--panel);display:grid;place-items:center;position:relative}
.lock .ring{position:absolute;inset:0;width:46px;height:46px;transform:rotate(-90deg)}
.lock .ring circle{fill:none;stroke:var(--sun);stroke-width:4;stroke-dasharray:132;stroke-dashoffset:132}
.lock.holding .ring circle{transition:stroke-dashoffset 3s linear;stroke-dashoffset:0}

/* stage */
.stagebar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:stretch}
#stage{width:100%;height:170px;border-radius:22px;background:var(--panel);display:block}
.transport{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--panel);border-radius:22px;padding:12px 16px}
.play{width:78px;height:78px;border-radius:50%;background:var(--go);color:#0f3d24;display:grid;place-items:center;box-shadow:0 6px 0 #1f8f52;transition:transform .08s}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #1f8f52}
.play.on{background:var(--stop);color:#4a0d17;box-shadow:0 6px 0 #b8324a}
.play svg{width:34px;height:34px}
.tempo{display:flex;flex-direction:column;align-items:center;gap:2px}
.tempo label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.tempo b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.tempo input{width:130px;accent-color:var(--sun)}
@media (max-width:560px){.stagebar{grid-template-columns:1fr}.transport{flex-direction:row;justify-content:space-between}#stage{height:150px}}

/* palette */
.panel{background:var(--panel);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:none;padding:7px 13px;border-radius:999px;background:var(--panel2);font-family:var(--display);font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.tab i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.tab[aria-pressed="true"]{background:var(--c);color:var(--dark)}
.tab[aria-pressed="true"] i{background:var(--dark)}
.cats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cat{padding:5px 12px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:800}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tvol{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--muted)}
.tvol input{width:120px;accent-color:var(--c)}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--blk),1fr));gap:10px;max-height:360px;overflow-y:auto;padding:6px 4px 8px;scrollbar-width:thin}
.blk{position:relative;border-radius:16px;padding:10px 12px 12px;background:var(--c);color:var(--dark);text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .08s;width:100%;min-width:0}
.blk:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.blk .nm{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:3px}
.blk.eraser{background:var(--panel2);color:var(--ink)}
.blk.empty{background:var(--panel2);color:var(--ink);border:2px dashed var(--c);box-shadow:none}
.blk.locked{filter:grayscale(1) brightness(.7)}
.blk.locked::after{content:"";position:absolute;right:10px;top:10px;width:18px;height:18px;background:var(--dark);-webkit-mask:var(--lockmask) center/contain no-repeat;mask:var(--lockmask) center/contain no-repeat}
.blk .sub{font-size:12px;opacity:.85;line-height:1.3}
.blk.rec{background:var(--stop);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
.slot{display:flex;flex-direction:column;gap:6px;min-width:0}
.mini-btns{display:flex;gap:6px;flex-wrap:wrap}
.mini-btns button{flex:1 1 auto;padding:5px 8px;border-radius:10px;background:var(--panel2);font-size:12px;font-weight:800}
.mini{display:flex;align-items:flex-end;gap:1px;height:22px}
.mini span{flex:1;background:currentColor;opacity:.75;border-radius:1px;min-height:0}
.hint{margin:0;color:var(--muted);font-size:14px}

/* board */
.board{overflow-x:auto;border-radius:22px;background:var(--panel);-webkit-overflow-scrolling:touch}
.grid{position:relative;display:grid;grid-template-columns:var(--lab) repeat(var(--bars),var(--cell));width:max-content;padding:10px 10px 12px 0;gap:6px 4px}
.corner,.lab{position:sticky;left:0;z-index:2;background:var(--panel)}
.num{text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-block:2px;border-radius:6px}
.num.now{background:var(--sun);color:var(--dark)}
.lab{display:flex;align-items:center;gap:6px;padding-left:10px;padding-right:6px;overflow-wrap:anywhere;font-family:var(--display);font-weight:800;font-size:14px;line-height:1.05;text-align:left;height:var(--rowh)}
.lab i{width:10px;height:28px;border-radius:5px;background:var(--c);flex:none}
.lab.muted{opacity:.4;text-decoration:line-through}
.cell{height:var(--rowh);border-radius:12px;background:var(--panel2);border:2px dashed var(--line);padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden}
.cell.fill{background:var(--c);border:2px solid rgba(0,0,0,.18);color:var(--dark)}
.cell.fill .nm{font-size:11px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .mini{height:16px}
.cell.row-on:not(.fill){border-color:var(--c)}
.head{position:absolute;top:0;bottom:0;width:3px;background:var(--sun);border-radius:2px;pointer-events:none;z-index:1;box-shadow:0 0 12px var(--sun);left:0}
.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.lit{filter:brightness(1.25)}

/* songs */
.tools{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:14px;background:var(--panel2);font-weight:800;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.main{background:var(--sun);color:var(--dark);box-shadow:0 4px 0 #b8901a}
.btn.go{background:var(--go);color:#0f3d24}
.btn.warn{background:var(--stop);color:#4a0d17}
.btn.sm{padding:7px 12px;border-radius:12px;font-size:14px}
.saverow{display:flex;gap:10px;flex-wrap:wrap}
.saverow .inp{flex:1 1 180px;width:auto}
.inp{flex:none;min-width:0;width:100%;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:800}
.songs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.songs li{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:14px;padding:8px 8px 8px 14px;flex-wrap:wrap}
.songs .t{flex:1 1 140px;min-width:0}
.songs .t b{display:block;font-family:var(--display);font-size:18px;line-height:1.1;overflow-wrap:anywhere}
.songs .t small{color:var(--muted)}
.status{margin:0;font-size:14px;color:var(--sun);min-height:1.2em}
[data-skin="jasny"] .status{color:hsl(var(--hue) 70% 35%)}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#intro{z-index:80;background:#000;overflow:hidden}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
.skip{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:10px 18px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-weight:800;z-index:2}
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;text-align:center}
.star{width:min(62vw,260px);aspect-ratio:1;max-width:100%;display:grid;place-items:center;animation:twinkle 1.6s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(255,210,63,.6))}
.star svg{width:100%;height:100%}
@keyframes twinkle{50%{transform:scale(1.07) rotate(4deg)}}
.big-t{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,48px)}
.who{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.who button{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:20px}

.picpad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.picpad button{width:72px;height:72px;border-radius:18px;background:var(--panel);font-size:38px}
.dots{display:flex;gap:10px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.modalwrap{z-index:60;background:rgba(10,6,30,.6);display:flex;align-items:flex-start;justify-content:center;padding:16px}
.sheet{background:var(--bg);border-radius:24px;width:min(640px,100%);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);margin-block:auto}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{width:42px;height:42px;border-radius:12px;background:var(--panel);display:grid;place-items:center;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 14px;border-radius:14px;background:var(--panel);font-weight:800;display:flex;align-items:center;gap:8px}
.opt[aria-pressed="true"]{background:var(--sun);color:var(--dark)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.chars button{background:var(--panel);border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:800}
.chars button[aria-pressed="true"]{outline:4px solid var(--sun)}
.chars canvas{width:80px;height:80px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid transparent}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.crop{position:relative;width:min(300px,100%);aspect-ratio:1;margin:0 auto;touch-action:none}
.crop canvas{width:100%;height:100%;border-radius:16px;background:#000}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.stk div{background:var(--panel);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.stk div.no{opacity:.4;filter:grayscale(1)}
.stk span{font-size:40px;line-height:1}
.stk b{font-family:var(--display);font-size:16px;line-height:1.1}
.stk small{font-size:12px;color:var(--muted)}
.vprev{width:100%;max-height:52vh;object-fit:contain;border-radius:16px;background:#000;display:block}
.prog{height:14px;border-radius:999px;background:var(--panel);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--go);transition:width .2s}

/* parent panel */
#parent{z-index:70}
.pp{max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.pp-h{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.ptabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.ptabs button{flex:none;padding:8px 14px;border-radius:999px;background:var(--panel);font-weight:800}
.ptabs button[aria-pressed="true"]{background:var(--sun);color:var(--dark)}
.card{background:var(--panel);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>label,.row>.lbl{flex:1 1 220px;min-width:0}
.row small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.sel,.tim{padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:800}
.rng{display:flex;align-items:center;gap:10px}
.rng input{width:170px;accent-color:var(--sun)}
.rng b{min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.sw-t{position:relative;width:54px;height:32px;flex:none}
.sw-t input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw-t i{position:absolute;inset:0;border-radius:999px;background:var(--panel2);transition:background .15s;pointer-events:none}
.sw-t i::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .15s}
.sw-t input:checked+i{background:var(--go)}
.sw-t input:checked+i::after{transform:translateX(22px);background:#0f3d24}
.sw-t input:focus-visible+i{outline:3px solid var(--sun);outline-offset:2px}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.presets button{background:var(--panel2);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.presets button[aria-pressed="true"]{outline:4px solid var(--sun)}
.presets b{font-family:var(--display);font-size:20px}
.presets small{color:var(--muted);font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi div{background:var(--panel2);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.bars7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:18px}
.bars7 div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars7 i{display:block;width:100%;max-width:40px;background:var(--go);border-radius:8px 8px 3px 3px;min-height:3px}
.bars7 em{font-style:normal;color:var(--ink);font-weight:800}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:8px 10px;flex-wrap:wrap}
.li .grow{flex:1 1 160px;min-width:0}
.chipc{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--c);margin-right:6px;vertical-align:-2px}
.prose{font-size:15px;line-height:1.5;max-width:65ch}
.prose ol{margin:6px 0;padding-left:20px}
/* pin */
#pin{z-index:90;background:rgba(10,6,30,.82);display:flex;align-items:center;justify-content:center}
.pinbox{background:var(--bg);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;width:min(340px,100%);margin:16px}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.keys button{height:62px;border-radius:16px;background:var(--panel);font-family:var(--display);font-size:28px;font-weight:800}
#fsback{z-index:95}
#toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(520px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:tin .25s ease-out;text-align:center}
@keyframes tin{from{transform:translateY(20px);opacity:0}}
@media (max-width:520px){:root{--lab:100px;--cell:60px;--blk:108px}.lab{font-size:11px;hyphens:auto}.me span{max-width:90px}}
[data-motion="less"] *,[data-motion="less"] *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.pop,.blk.rec,.star{animation:none}}

:root{--lockmask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z'/></svg>")}
</style>
<script>window.MK_PWA=true;</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>

(function(){"use strict";
/* ================= UTIL / I18N / STORE ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
  if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
  else if(k==='html')e.innerHTML=v;else if(k==='text')e.textContent=v;else e.setAttribute(k,v===true?'':v);}
  kids.flat().forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);});return e;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const pad2=n=>String(n).padStart(2,'0');
function today(d){d=d||new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function nowHM(){const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function isWeekend(d){d=d||new Date();const w=d.getDay();return w===0||w===6;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* i18n: Polish strings are keys; EN dictionary filled at build */
let EN={};
function T(s,vars){let r=(S&&S.look&&S.look.lang==='en'&&EN[s])||s;if(vars)for(const k in vars)r=r.split('{'+k+'}').join(vars[k]);return r;}

/* ---- settings & profiles ---- */
const DKEY='muzyczne-klocki-v2';
let DB=null,S=null,P=null,song=null;
function defaults(){return{
  pin:'1234',
  time:{on:false,limitWk:30,limitWe:60,sepWeekend:false,hoursOn:false,fromWk:'08:00',toWk:'19:30',fromWe:'08:00',toWe:'20:30',breakEvery:0,warn5:true},
  sound:{maxVol:85,noLoud:false,tempoMin:70,tempoMax:150,quiet:false,quietFrom:'19:00'},
  perm:{mic:true,files:true,delSongs:true,download:true,exitFs:true,clear:true,tracks:Object.fromEntries(TRACKS.map(t=>[t.id,true]))},
  level:{preset:'mid',bars:16,showTempo:true,limit:0,trackVol:false},
  video:{format:'v',scene:'disco',photo:false},
  look:{skin:'kolor',big:false,lessMotion:false,lang:'pl',readAloud:false},
  rewards:{stickers:true,unlock:false},
  lock:{warnClose:true}
};}
function merge(def,o){if(!o||typeof o!=='object')return def;for(const k in def){if(def[k]&&typeof def[k]==='object'&&!Array.isArray(def[k]))def[k]=merge(def[k],o[k]);else if(o[k]!==undefined&&typeof o[k]===typeof def[k])def[k]=o[k];}return def;}
function fixProfile(p){p.stats=p.stats||{};const s=p.stats;s.days=s.days||{};s.sessions=s.sessions||[];s.blocks=s.blocks||{};s.stickers=s.stickers||{};s.extra=s.extra||{};
  s.total=s.total||0;s.videos=s.videos||0;s.recs=s.recs||0;s.animals=s.animals||{};p.songs=(p.songs||[]).map(x=>Object.assign(x,{song:normSong(x.song)}));
  p.fx=p.fx||['none','none','none','none'];p.sampleNames=p.sampleNames||[null,null,null,null];if(p.hue==null)p.hue=250;if(!p.char)p.char='robot';return p;}
function newProfile(name){return fixProfile({id:'p'+uid(),name:name||'Muzyk',photo:null,char:'robot',hue:250,picPin:null,songs:[],cur:null,stats:{}});}
function loadDB(){
  try{const raw=localStorage.getItem(DKEY);if(raw){const d=JSON.parse(raw);DB={v:2,settings:merge(defaults(),d.settings),profiles:Array.isArray(d.profiles)?d.profiles:[],cur:d.cur,meta:d.meta||{}};}}catch(e){}
  if(!DB)DB={v:2,settings:defaults(),profiles:[],cur:null,meta:{}};
  DB.profiles.forEach(fixProfile);S=DB.settings;
}
let saveT=null;
function saveDB(){clearTimeout(saveT);saveT=null;try{localStorage.setItem(DKEY,JSON.stringify(DB));return true;}catch(e){toast(T('Brak miejsca na zapis. Usuń stare nagrania albo piosenki w panelu rodzica.'));return false;}}
function saveSoon(){if(!saveT)saveT=setTimeout(saveDB,800);}

/* ---- songs ---- */
function emptySong(){const t={};TRACKS.forEach(tr=>t[tr.id]=new Array(MAXB).fill(null));return{tracks:t,vol:{}};}
const OLD_ORDER=['drums','bass','mel','chords','fx','user'];
function normSong(s){
  const r=emptySong();if(!s)return r;
  if(Array.isArray(s)){s.forEach((row,i)=>{const tid=OLD_ORDER[i];if(tid&&Array.isArray(row))row.forEach((k,b)=>{if(b<MAXB&&LOOPS[k]&&LOOPS[k].tid===tid)r.tracks[tid][b]=k;});});return r;}
  if(s.tracks)for(const tid in s.tracks){if(!r.tracks[tid]||!Array.isArray(s.tracks[tid]))continue;s.tracks[tid].forEach((k,b)=>{if(b<MAXB&&LOOPS[k]&&LOOPS[k].tid===tid)r.tracks[tid][b]=k;});}
  if(s.vol)for(const k in s.vol)if(typeof s.vol[k]==='number')r.vol[k]=clamp(s.vol[k],0,1.5);
  return r;
}
function cloneSong(s){return{tracks:Object.fromEntries(Object.entries(s.tracks).map(([k,v])=>[k,v.slice()])),vol:Object.assign({},s.vol)};}
function songIsEmpty(s){return Object.values(s.tracks).every(r=>r.every(k=>!k));}
function trackOn(tid){return S.perm.tracks[tid]!==false;}
function bars(){return S.level.bars;}
function songLen(s){s=s||song;let last=-1;const B=bars();for(const tid in s.tracks){if(!trackOn(tid))continue;s.tracks[tid].forEach((k,b)=>{if(k&&b<B&&b>last)last=b;});}return Math.max(1,last+1);}
function demoSong(){
  const s=emptySong(),T_=s.tracks;
  for(let b=0;b<12;b++){T_.drums[b]=b<2?'d8':(b%4===3?'d3':'d1');T_.chords[b]=b%2?'c3':'c2';}
  T_.drums[10]='d5';T_.drums[11]='d22';
  for(let b=2;b<12;b++)T_.bass[b]=b%2?'b4':'b2';
  ['m2','m1','m5','m4','m9','m6','m8','m4'].forEach((k,i)=>T_.mel[4+i]=k);
  T_.inst[6]='i2';T_.inst[7]='i10';T_.voice[2]='v1';T_.voice[3]='v3';T_.voice[8]='v7';T_.voice[9]='v9';
  T_.animals[1]='a1';T_.animals[5]='a4';T_.animals[9]='a2';T_.fx[0]='x3';T_.fx[4]='x16';T_.fx[11]='x13';
  return s;
}

/* ---- IndexedDB for recordings ---- */
function idbOpen(name,store){return new Promise((res,rej)=>{let r;try{r=indexedDB.open(name,1);}catch(e){rej(e);return;}r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(store))r.result.createObjectStore(store);};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function fput(k,v){try{const db=await idbOpen('mk2','files');await new Promise(r=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(v,k);tx.oncomplete=r;tx.onerror=r;});}catch(e){}}
async function fdel(k){try{const db=await idbOpen('mk2','files');await new Promise(r=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(k);tx.oncomplete=r;tx.onerror=r;});}catch(e){}}
async function fall(){try{const db=await idbOpen('mk2','files');return await new Promise(res=>{const o=[];const c=db.transaction('files').objectStore('files').openCursor();c.onsuccess=()=>{const cu=c.result;if(cu){o.push([cu.key,cu.value]);cu.continue();}else res(o);};c.onerror=()=>res(o);});}catch(e){return[];}}
async function fget(k){try{const db=await idbOpen('mk2','files');return await new Promise(res=>{const q=db.transaction('files').objectStore('files').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);});}catch(e){return null;}}

/* migrate data from the first version (single song list) */
async function migrateOld(p){
  try{const l=JSON.parse(localStorage.getItem('muzyczne-klocki-piosenki')||'[]');if(Array.isArray(l))l.forEach(x=>{if(x&&x.song)p.songs.push({id:x.id||uid(),name:x.name||'Piosenka',song:normSong(x.song),bpm:x.bpm||112,date:x.date||Date.now(),star:false});});}catch(e){}
  try{const d=JSON.parse(localStorage.getItem('muzyczne-klocki-v1')||'null');if(d&&d.song)p.cur={song:normSong(d.song),bpm:d.bpm||112,name:''};}catch(e){}
  try{const db=await idbOpen('muzyczne-klocki','samples');const all=await new Promise(res=>{const o=[];const c=db.transaction('samples').objectStore('samples').openCursor();c.onsuccess=()=>{const cu=c.result;if(cu){o.push([cu.key,cu.value]);cu.continue();}else res(o);};c.onerror=()=>res(o);});
    for(const [k,v] of all)if(v&&v.blob&&k>=0&&k<4){await fput(p.id+':'+k,{blob:v.blob,name:v.name});p.sampleNames[k]=v.name||null;}}catch(e){}
}

let ctx=null,master=null,comp=null,quietF=null,out=null,trackBus={},bus=null,noiseBuf=null,distCurve=null;
const userBufs=[null,null,null,null];let nameBuf=null;
function makeCtx(){
  if(ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  ctx=new AC();
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  buildChain();
}
function buildChain(){
  comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ctx.destination);
  quietF=ctx.createBiquadFilter();quietF.type='lowpass';quietF.frequency.value=20000;quietF.connect(comp);
  master=ctx.createGain();master.connect(quietF);
  applyVolume();newOut();
}
function audio(){makeCtx();if(ctx.state==='suspended')ctx.resume();}
function quietNow(){if(!S||!S.sound.quiet)return false;const h=nowHM();return h>=S.sound.quietFrom||h<'06:00';}
function applyVolume(){if(!master)return;const q=quietNow();master.gain.value=(S.sound.maxVol/100)*(q?.55:1);quietF.frequency.value=q?2600:20000;}
function tvol(id){return (song&&song.vol&&song.vol[id]!=null)?song.vol[id]:1;}
function newOut(){
  out=ctx.createGain();out.connect(master);trackBus={};
  TRACKS.forEach(t=>{const g=ctx.createGain();g.gain.value=tvol(t.id);g.connect(out);trackBus[t.id]=g;});
}
function setTrackVol(id,v){if(trackBus[id])trackBus[id].gain.value=v;}
function killOut(){if(!out)return;const o=out;try{o.gain.cancelScheduledValues(ctx.currentTime);o.gain.setValueAtTime(0,ctx.currentTime);}catch(e){}setTimeout(()=>{try{o.disconnect();}catch(e){}},4000);newOut();}
function renderOffline(fn,dur){
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const sr=44100,off=new OAC(2,Math.ceil(dur*sr),sr);
  const keep={ctx,master,comp,quietF,out,trackBus};
  try{ctx=off;buildChain();fn();}finally{ctx=keep.ctx;master=keep.master;comp=keep.comp;quietF=keep.quietF;out=keep.out;trackBus=keep.trackBus;}
  return new Promise((res,rej)=>{off.oncomplete=e=>res(e.renderedBuffer);const p=off.startRendering();if(p&&p.then)p.then(res,rej);});
}

/* primitives */
const mtof=n=>440*Math.pow(2,(n-69)/12);
function GN(dest){const g=ctx.createGain();g.connect(dest||bus||out);return g;}
function env(g,t,p,a,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,p),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function hold(g,t,p,a,dur,r){p=Math.max(.0002,p);const e=t+Math.max(a+.005,dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.setValueAtTime(p,e);g.gain.exponentialRampToValueAtTime(.0001,e+r);}
function O(type,f,t,dur,dest){const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(t+dur+.05);return o;}
function NZ(t,dur,dest){const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.connect(dest);s.start(t,Math.random()*1.5);s.stop(t+dur);return s;}
function FL(type,f,dest,q){const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;if(q!=null)b.Q.value=q;b.connect(dest);return b;}
function LFO(param,rate,depth,t,dur,type){const l=ctx.createOscillator();l.type=type||'sine';l.frequency.value=rate;const g=ctx.createGain();g.gain.value=depth;l.connect(g);g.connect(param);l.start(t);l.stop(t+dur+.05);return l;}
function dist(dest){const w=ctx.createWaveShaper();if(!distCurve){distCurve=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;distCurve[i]=Math.tanh(x*6);}}w.curve=distCurve;w.connect(dest);return w;}

/* drums */
function drum(d,v,t){
  switch(d){
  case'k':{const g=GN();env(g,t,v,.002,.35);const o=O('sine',150,t,.4,g);o.frequency.exponentialRampToValueAtTime(42,t+.14);break;}
  case'K':{const g=GN();env(g,t,v,.003,.9);const o=O('sine',72,t,1,g);o.frequency.exponentialRampToValueAtTime(42,t+.35);const g2=GN();env(g2,t,.25*v,.001,.03);O('square',1200,t,.04,FL('lowpass',2000,g2));break;}
  case's':{const g=GN();env(g,t,.45*v,.002,.17);NZ(t,.2,FL('highpass',1300,g));const g2=GN();env(g2,t,.3*v,.002,.08);O('triangle',190,t,.1,g2);break;}
  case'h':case'o':{const op=d==='o';const g=GN();env(g,t,(op?.18:.14)*v,.001,op?.22:.045);NZ(t,op?.25:.06,FL('highpass',7500,g));break;}
  case'c':{[0,.012,.024].forEach((o,i)=>{const g=GN();env(g,t+o,.5*v,.001,i<2?.012:.16);NZ(t+o,i<2?.02:.2,FL('bandpass',1500,g,1.2));});break;}
  case't':case'm':{const f0=d==='t'?230:140;const g=GN();env(g,t,.6*v,.002,.32);const o=O('sine',f0,t,.36,g);o.frequency.exponentialRampToValueAtTime(f0*.55,t+.25);break;}
  case'w':{const g=GN();env(g,t,.16*v,.001,.25);const b=FL('bandpass',800,g,2);O('square',540,t,.3,b);O('square',800,t,.3,b);break;}
  case'r':{const g=GN();env(g,t,.3*v,.001,.035);O('square',1700,t,.05,FL('bandpass',1700,g,3));NZ(t,.03,FL('highpass',3000,g));break;}
  case'z':{const g=GN();env(g,t,.12*v,.012,.06);NZ(t,.1,FL('bandpass',6500,g,1.5));break;}
  case'y':{const g=GN();env(g,t,.22*v,.002,1.3);NZ(t,1.4,FL('highpass',4500,g));const g2=GN();env(g2,t,.1*v,.002,.6);NZ(t,.7,FL('bandpass',3000,g2,.7));break;}
  case'g':{const g=GN();env(g,t,.5*v,.002,.22);const o=O('sine',340,t,.25,g);o.frequency.exponentialRampToValueAtTime(260,t+.08);break;}
  case'b':{[0,.02,.045].forEach((o,i)=>{const g=GN();env(g,t+o,.22*v/(i+1),.002,.08);NZ(t+o,.1,FL('bandpass',7500,g,2));});break;}
  }
}
function bbox(k,v,t){
  if(k==='k'){const g=GN();env(g,t,.9*v,.002,.15);const o=O('sine',110,t,.2,g);o.frequency.exponentialRampToValueAtTime(50,t+.1);const g2=GN();env(g2,t,.25*v,.001,.03);NZ(t,.05,FL('lowpass',900,g2));}
  else if(k==='s'){const g=GN();env(g,t,.5*v,.002,.12);NZ(t,.15,FL('bandpass',2200,g,.8));const g2=GN();env(g2,t,.3*v,.001,.02);NZ(t,.03,FL('lowpass',600,g2));}
  else if(k==='h'){const g=GN();env(g,t,.18*v,.004,.06);NZ(t,.1,FL('highpass',6000,g));}
}

/* pitched instruments */
function note(i,n,t,dur,v){
  v=v||1;const f=mtof(n);
  switch(i){
  case'saw':{const g=GN();hold(g,t,.42*v,.01,dur,.03);const fl=FL('lowpass',300,g,6);fl.frequency.setValueAtTime(1600,t);fl.frequency.exponentialRampToValueAtTime(260,t+.18);O('sawtooth',f,t,dur+.05,fl);O('sine',f/2,t,dur+.05,g);break;}
  case'sub':{const g=GN();hold(g,t,.55*v,.01,dur,.05);O('sine',f,t,dur+.08,g);const g2=GN();hold(g2,t,.08*v,.01,dur,.05);O('triangle',f*2,t,dur+.08,g2);break;}
  case'wob':{const g=GN();hold(g,t,.35*v,.01,dur,.05);const fl=FL('lowpass',600,g,8);LFO(fl.frequency,4,500,t,dur+.1);O('sawtooth',f,t,dur+.1,fl);O('sine',f/2,t,dur+.1,g);break;}
  case'pluckb':{const g=GN();env(g,t,.5*v,.004,Math.min(.5,dur+.1));const fl=FL('lowpass',300,g,4);fl.frequency.setValueAtTime(2500,t);fl.frequency.exponentialRampToValueAtTime(200,t+.2);O('square',f,t,.6,fl);break;}
  case'chip':{const g=GN();hold(g,t,.11*v,.015,dur,.08);const o=O('square',f,t,dur+.1,FL('lowpass',3200,g));LFO(o.frequency,5.5,4,t+.12,dur);break;}
  case'flute':{const g=GN();hold(g,t,.17*v,.06,dur,.12);const o=O('sine',f,t,dur+.15,g);LFO(o.frequency,5,5,t+.15,dur);const ng=GN();hold(ng,t,.012*v,.03,dur,.1);NZ(t,dur+.15,FL('bandpass',f*2,ng,3));break;}
  case'pluck':{const g=GN();env(g,t,.22*v,.003,Math.min(.6,dur+.25));O('triangle',f,t,.7,g);const g2=GN();env(g2,t,.06*v,.002,.15);O('square',f*2,t,.2,FL('lowpass',3000,g2));break;}
  case'whistle':{const g=GN();hold(g,t,.12*v,.03,dur,.06);const o=O('sine',f,t,dur+.1,g);LFO(o.frequency,6,f*.012,t+.1,dur);break;}
  case'lead':{const g=GN();hold(g,t,.09*v,.01,dur,.06);const fl=FL('lowpass',2400,g,2);O('sawtooth',f,t,dur+.1,fl).detune.value=-6;O('sawtooth',f,t,dur+.1,fl).detune.value=6;break;}
  case'bell':{const g=GN();env(g,t,.16*v,.002,1.1);const c=O('sine',f,t,1.2,g);const mg=ctx.createGain();mg.gain.setValueAtTime(f*2,t);mg.gain.exponentialRampToValueAtTime(1,t+.8);O('sine',f*3.5,t,1.2,mg);mg.connect(c.frequency);break;}
  case'xylo':{const g=GN();env(g,t,.3*v,.002,.35);O('sine',f,t,.4,g);const g2=GN();env(g2,t,.1*v,.001,.08);O('sine',f*4,t,.1,g2);break;}
  case'marimba':{const g=GN();env(g,t,.32*v,.005,.55);O('sine',f,t,.6,g);const g2=GN();env(g2,t,.05*v,.003,.12);O('sine',f*4,t,.15,g2);break;}
  case'trumpet':{const g=GN();hold(g,t,.13*v,.03,dur,.06);const fl=FL('lowpass',500,g,3);fl.frequency.setValueAtTime(500,t);fl.frequency.linearRampToValueAtTime(2600,t+.06);fl.frequency.linearRampToValueAtTime(1800,t+.25);const o=O('sawtooth',f,t,dur+.1,fl);LFO(o.frequency,5.5,f*.008,t+.2,dur);break;}
  case'violin':case'cello':{const c=i==='cello';const g=GN();hold(g,t,(c?.16:.1)*v,.09,dur,.12);const fl=FL('lowpass',c?1600:3200,g,1);const a=O('sawtooth',f,t,dur+.15,fl);const b=O('sawtooth',f,t,dur+.15,fl);b.detune.value=8;LFO(a.frequency,5.5,f*.01,t+.15,dur);LFO(b.frequency,5.2,f*.01,t+.15,dur);break;}
  case'harp':{const g=GN();env(g,t,.25*v,.003,1.3);O('triangle',f,t,1.4,g);const g2=GN();env(g2,t,.06*v,.002,.5);O('sine',f*2,t,.6,g2);break;}
  case'accordion':{const g=GN();hold(g,t,.07*v,.03,dur,.06);const fl=FL('lowpass',2600,g);O('square',f,t,dur+.1,fl).detune.value=-9;O('square',f,t,dur+.1,fl).detune.value=9;O('sawtooth',f*2,t,dur+.1,fl);LFO(g.gain,6,.02,t,dur);break;}
  case'eguitar':{const g=GN();hold(g,t,.09*v,.005,dur,.08);const fl=FL('lowpass',3000,g);const pre=ctx.createGain();pre.gain.value=1.5;pre.connect(dist(fl));O('sawtooth',f,t,dur+.1,pre);O('sawtooth',f*1.005,t,dur+.1,pre);break;}
  case'musicbox':case'celesta':{const ce=i==='celesta';const g=GN();env(g,t,(ce?.14:.18)*v,.002,ce?.8:1.1);O('sine',f,t,1.2,g);const g2=GN();env(g2,t,.06*v,.001,.25);O('sine',f*(ce?4:3),t,.3,g2);break;}
  case'steel':{const g=GN();env(g,t,.18*v,.003,.7);O('sine',f,t,.8,g);const g2=GN();env(g2,t,.1*v,.003,.35);O('sine',f*2,t,.4,g2);const g3=GN();env(g3,t,.05*v,.002,.15);O('sine',f*4.03,t,.2,g3);break;}
  case'kalimba':{const g=GN();env(g,t,.25*v,.002,.9);O('sine',f,t,1,g);const g2=GN();env(g2,t,.08*v,.001,.06);O('sine',f*5.4,t,.08,g2);break;}
  case'organ':{const g=GN();hold(g,t,.06*v,.01,dur,.05);[1,2,3,4].forEach((h,j)=>{const gg=ctx.createGain();gg.gain.value=[1,.6,.35,.25][j];gg.connect(g);O('sine',f*h,t,dur+.1,gg);});break;}
  case'piano':{const g=GN();env(g,t,.22*v,.003,Math.min(1.6,.5+dur));O('triangle',f,t,1.8,FL('lowpass',Math.min(12000,f*6),g));const g2=GN();env(g2,t,.07*v,.002,.3);O('sine',f*2,t,.35,g2);break;}
  case'banjo':{const g=GN();env(g,t,.2*v,.002,.25);O('square',f,t,.3,FL('bandpass',f*3,g,1.5));O('triangle',f,t,.3,g);break;}
  case'sax':{const g=GN();hold(g,t,.12*v,.04,dur,.08);const o=O('sawtooth',f,t,dur+.12,FL('bandpass',1300,g,1.2));LFO(o.frequency,5,f*.012,t+.2,dur);const g2=GN();hold(g2,t,.04*v,.04,dur,.08);O('sawtooth',f,t,dur+.12,FL('lowpass',900,g2));break;}
  case'tuba':{const g=GN();hold(g,t,.3*v,.04,dur,.06);const fl=FL('lowpass',300,g,2);fl.frequency.setValueAtTime(300,t);fl.frequency.linearRampToValueAtTime(900,t+.06);fl.frequency.linearRampToValueAtTime(600,t+.2);O('sawtooth',f,t,dur+.1,fl);break;}
  case'ocarina':{const g=GN();hold(g,t,.2*v,.05,dur,.1);const o=O('sine',f,t,dur+.12,g);LFO(o.frequency,5.5,f*.01,t+.2,dur);const g2=GN();hold(g2,t,.03*v,.05,dur,.1);O('triangle',f*2,t,dur+.12,g2);break;}
  default:note('chip',n,t,dur,v);
  }
}
function chord(st,notes,t,dur,sd,v){
  v=v||1;
  if(st==='arp'){const steps=Math.max(1,Math.round(dur/sd));for(let k=0;k<steps;k++){const n=notes[k%notes.length]+(Math.floor(k/notes.length)%2?12:0);note('pluck',n+12,t+k*sd,sd*.9,.8*v);}return;}
  if(st==='guitar'){notes.forEach((n,j)=>{const tt=t+j*.028;const g=GN();env(g,tt,.1*v,.003,Math.min(1.2,dur+.4));const fl=FL('lowpass',2600,g);O('triangle',mtof(n),tt,1.3,fl);O('sawtooth',mtof(n),tt,.4,fl).detune.value=4;});return;}
  if(st==='piano'){notes.forEach(n=>note('piano',n,t,dur,.7*v));return;}
  if(st==='power'){notes.forEach(n=>note('eguitar',n,t,dur,.8*v));return;}
  if(st==='stab'){const g=GN();env(g,t,.12*v,.003,.18);const fl=FL('lowpass',3500,g);notes.forEach(n=>{O('sawtooth',mtof(n+12),t,.25,fl).detune.value=-8;O('sawtooth',mtof(n+12),t,.25,fl).detune.value=8;});return;}
  const g=GN();
  if(st==='pluck')env(g,t,.13*v,.004,dur*1.3);
  else hold(g,t,(st==='organ'?.06:.075)*v,st==='organ'?.02:.12,dur,.15);
  const fl=FL('lowpass',st==='pluck'?2200:(st==='organ'?1800:1300),g);
  notes.forEach(n=>{if(st==='organ'){O('square',mtof(n),t,dur+.2,fl);O('sine',mtof(n+12),t,dur+.2,fl);}else{O('sawtooth',mtof(n),t,dur+.2,fl).detune.value=-7;O('sawtooth',mtof(n),t,dur+.2,fl).detune.value=7;}});
}

/* formant voice */
const VOW={a:[800,1150,2900],e:[500,1750,2500],i:[300,2300,3000],o:[450,800,2830],u:[325,700,2530],m:[250,1200,2500]};
function voice(e,t,dur){
  const v=e.v||1,notes=e.ch||[e.n];
  notes.forEach((n,j)=>{
    const f=mtof(n)*(e.ch?(j%2?1.003:.997):1);
    const eg=GN();
    const peak=(e.ch?.22/Math.sqrt(notes.length):.34)*v;
    hold(eg,t,peak,e.cons==='h'?.05:(e.ch?.15:.02),dur,.1);
    const src=ctx.createOscillator();src.type=e.robot?'square':'sawtooth';src.frequency.setValueAtTime(f,t);
    if(e.slide)src.frequency.linearRampToValueAtTime(f*Math.pow(2,e.slide/12),t+dur);
    if(!e.robot)LFO(src.frequency,5+j*.3,f*.012,t+.12,dur+.1);
    const fm=VOW[e.vo]||VOW.a,amp=[1,.5,.25];
    fm.forEach((ff,k)=>{const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=e.vo==='m'?3:8;
      if(e.cons==='l'&&k<2){bp.frequency.setValueAtTime(k===0?350:2000,t);bp.frequency.linearRampToValueAtTime(ff,t+.06);}
      else bp.frequency.setValueAtTime(ff,t);
      const gg=ctx.createGain();gg.gain.value=amp[k]*(e.vo==='m'&&k>0?.2:1)*2.6;src.connect(bp);bp.connect(gg);gg.connect(eg);});
    src.start(t);src.stop(t+dur+.2);
    if(j===0&&e.cons==='h'){const hg=GN();env(hg,t,.12*v,.005,.06);NZ(t,.08,FL('bandpass',1800,hg,.7));}
    if(j===0&&e.cons==='b'){const bg=GN();env(bg,t,.4*v,.002,.05);O('sine',90,t,.07,bg);}
  });
}

/* animals */
function animal(a,t,p,v,dur){
  p=p||1;v=v||1;
  switch(a){
  case'cat':{const g=GN();hold(g,t,.3*v,.04,.5,.12);const bp=FL('bandpass',2200,g,6);bp.frequency.setValueAtTime(2200,t);bp.frequency.linearRampToValueAtTime(1100,t+.25);bp.frequency.linearRampToValueAtTime(800,t+.55);const bp2=FL('bandpass',900,g,5);const o=O('sawtooth',520*p,t,.7,bp);o.connect(bp2);o.frequency.linearRampToValueAtTime(720*p,t+.2);o.frequency.linearRampToValueAtTime(430*p,t+.6);break;}
  case'dog':{const g=GN();env(g,t,.5*v,.008,.16);const o=O('sawtooth',320*p,t,.2,FL('bandpass',700,g,2.5));o.frequency.exponentialRampToValueAtTime(170*p,t+.15);const g2=GN();env(g2,t,.15*v,.003,.06);NZ(t,.08,FL('bandpass',1200,g2,1));break;}
  case'cow':{const g=GN();hold(g,t,.4*v,.08,.9,.2);const lp=FL('lowpass',350,g,4);lp.frequency.setValueAtTime(300,t);lp.frequency.linearRampToValueAtTime(900,t+.35);lp.frequency.linearRampToValueAtTime(400,t+1);const o=O('sawtooth',115*p,t,1.2,lp);o.frequency.linearRampToValueAtTime(135*p,t+.3);o.frequency.linearRampToValueAtTime(100*p,t+1.05);LFO(o.frequency,5,3,t,1.1);break;}
  case'duck':{const g=GN();env(g,t,.32*v,.005,.17);const o=O('square',290*p,t,.2,FL('bandpass',1300,g,4));o.frequency.linearRampToValueAtTime(230*p,t+.17);o.connect(FL('bandpass',2600,g,5));break;}
  case'frog':{[0,.16].forEach(o=>{const g=GN();env(g,t+o,.4*v,.005,.11);const am=ctx.createGain();am.gain.value=0;am.connect(FL('bandpass',700,g,2));LFO(am.gain,32,1,t+o,.13,'square');O('sawtooth',(o?140:120)*p,t+o,.13,am);});break;}
  case'rooster':{[[0,.12,500,560],[.15,.12,560,640],[.3,.12,640,720],[.45,.55,820,600]].forEach(([o,d,f1,f2])=>{const g=GN();hold(g,t+o,.22*v,.02,d,.06);const oo=O('sawtooth',f1*p,t+o,d+.08,FL('bandpass',1500,g,3));oo.frequency.linearRampToValueAtTime(f2*p,t+o+d);LFO(oo.frequency,9,12,t+o,d);});break;}
  case'sheep':{const g=GN();hold(g,t,.28*v,.03,.6,.12);LFO(g.gain,13,.13,t,.75);const o=O('sawtooth',380*p,t,.8,FL('bandpass',1800,g,5));o.connect(FL('bandpass',500,g,4));o.frequency.linearRampToValueAtTime(350*p,t+.7);break;}
  case'elephant':{const g=GN();hold(g,t,.3*v,.06,.75,.15);const o=O('sawtooth',300*p,t,1,FL('bandpass',1100,g,2));o.frequency.exponentialRampToValueAtTime(760*p,t+.25);o.frequency.linearRampToValueAtTime(620*p,t+.85);LFO(o.frequency,11,25,t,.9);const ng=GN();hold(ng,t,.05*v,.05,.7,.1);NZ(t,.85,FL('bandpass',2500,ng,1));break;}
  case'owl':{const g=GN();hold(g,t,.3*v,.08,.35,.15);const o=O('sine',380*p,t,.6,g);o.frequency.linearRampToValueAtTime(340*p,t+.45);const g2=GN();hold(g2,t,.04*v,.08,.35,.15);O('triangle',760*p,t,.6,g2);break;}
  case'pig':{const g=GN();env(g,t,.4*v,.01,.18);const o=O('sawtooth',170*p,t,.22,FL('bandpass',600,g,3));o.frequency.linearRampToValueAtTime(130*p,t+.18);const am=GN();env(am,t,.2*v,.005,.15);NZ(t,.2,FL('bandpass',900,am,4));break;}

/* user samples */
function playBuf(b,t,fxk,dest){
  if(!b)return;
  const s=ctx.createBufferSource();s.buffer=b;
  const g=GN(dest);g.gain.value=.9;
  if(fxk==='chomik')s.playbackRate.value=1.55;
  if(fxk==='potwor')s.playbackRate.value=.66;
  if(fxk==='robot'){const rm=ctx.createGain();rm.gain.value=0;LFO(rm.gain,55,1,t,b.duration+.1);s.connect(rm);rm.connect(g);const dry=ctx.createGain();dry.gain.value=.3;s.connect(dry);dry.connect(g);}
  else s.connect(g);
  if(fxk==='echo'){const d=ctx.createDelay(1);d.delayTime.value=.22;const fb=ctx.createGain();fb.gain.value=.45;s.connect(d);d.connect(fb);fb.connect(d);d.connect(g);}
  s.start(t);
}

function playEvent(tid,e,t,sd){
  bus=trackBus[tid]||out;
  const dur=Math.max(.08,(e.l||1)*sd*.92);
  if(e.d)drum(e.d,e.v||.8,t);
  else if(e.bx)bbox(e.bx,e.v||.9,t);
  else if(e.an)animal(e.an,t,e.p,e.v,dur);
  else if(e.vo)voice(e,t,dur);
  else if(e.f)sfx(e.f,t,dur,e.n);
  else if(e.c)chord(e.i||'pad',e.c,t,dur,sd,e.v);
  else if(e.u!=null)playBuf(userBufs[e.u],t,P&&P.fx?P.fx[e.u]:'none');
  else if(e.n)note(e.i||'chip',e.n,t,dur,e.v);
}

  const bpm=$('#bpm');
  bpm.addEventListener('input',()=>{$('#bpmv').textContent=bpm.value;});bpm.addEventListener('change',saveCur);
  $('#play').onclick=()=>{if(player.playing){stopPlay();if(pListen)pListen=null;}else startPlay();};
  $('#saveSong').onclick=saveSong;$('#songName').addEventListener('change',saveCur);
  $('#wavBtn').onclick=exportWav;$('#vidBtn').onclick=openVideo;
  $('#demoBtn').onclick=()=>{if(player.playing)stopPlay();song=demoSong();newOutIf();saveCur();renderGrid();renderCats();setStatus(T('Załadowana przykładowa piosenka. Naciśnij zielony przycisk!'));};
  $('#meBtn').onclick=()=>openKid();$('#stkBtn').onclick=openStickers;$('#fsBtn').onclick=fsToggle;
  holdToOpen($('#lockBtn'),()=>askPin(()=>openParent()));
  $('#fileSample').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)await setSample(fileSlot,f,f.name.replace(/\.[^.]+$/,'').slice(0,16)||T('Dźwięk {n}',{n:fileSlot+1}));};
  $('#filePhoto').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{openCrop(img);};img.onerror=()=>toast(T('Nie udało się otworzyć zdjęcia.'));img.src=url;};
  $('#fileImport').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importBackup(f);};
  document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)&&!$('#app').hidden&&$('#modal').hidden&&$('#parent').hidden&&$('#pin').hidden){e.preventDefault();$('#play').click();}});
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('contextmenu',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault();});
  document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
  window.addEventListener('beforeunload',e=>{saveDB();if(S.lock.warnClose&&P){e.preventDefault();e.returnValue='';}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveDB();});
  window.addEventListener('resize',()=>{if(introS)fitCanvas($('#introCv'),1.5);});
  try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}catch(e){}
  const clr=$('#clearBtn');const setClr=()=>armBtn(clr,T('Wyczyść planszę'),T('Na pewno? Stuknij jeszcze raz'),()=>{if(!S.perm.clear)return;if(player.playing)stopPlay();song=emptySong();$('#songName').value='';newOutIf();saveCur();renderGrid();setStatus(T('Pusto! Wybierz klocek i zacznij od nowa. Zapisane piosenki zostały na liście.'));});
  setClrFn=setClr;clr.removeAttribute('data-t');
  const r=document.documentElement;r.setAttribute('data-skin',S.look.skin);r.setAttribute('data-big',S.look.big?'1':'0');r.setAttribute('data-motion',S.look.lessMotion?'less':'full');
  applySettings();
  if(window.MK_PWA&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  showGate();
  requestAnimationFrame(frame);
}
init();

})();
</script>
</body>
</html>
